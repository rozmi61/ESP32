<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Internetowy układ regulacji akwarium</title>
  <style>
    #dashboard { display: none; }
    #loginForm { max-width: 300px; margin-top: 50px; }
    label, input { display: block; margin-bottom: 10px; width: 200px; }
    button { padding: 5px 10px; }
    #loginError { color: red; }
  </style>
</head>
<body>
  <h2>Internetowy układ regulacji akwarium</h2>

  <!-- FORMULARZ LOGOWANIA -->
  <div id="loginForm">
    <h3>Logowanie</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Hasło">
    <button onclick="login()">Zaloguj</button>
    <p id="loginError"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <!-- Ustawienia temperatury -->
    <h3>Dwubiegunowa regulacja temperatury</h3>
    <label>Temperatura MIN:</label>
    <input type="number" id="tempMin" step="0.1"> °C

    <label>Temperatura MAX:</label>
    <input type="number" id="tempMax" step="0.1"> °C

    <button onclick="saveSettings()">Zapisz ustawienia</button>

    <hr>

    <!-- Odczyty -->
    <h3>Odczyty czujników</h3>
    <p>Temperatura wody (DS18B20): <span id="temp">--</span> °C</p>
    <p>Temperatura w pomieszczeniu (BMP280): <span id="bmpTemp">--</span> °C</p>
    <p>Ciśnienie w pomieszczeniu (BMP280): <span id="bmpPressure">--</span> hPa</p>
    <p>Grzałka: <span id="heaterState">--</span></p>

    <p>
      <a href="https://rozmi61.github.io/ESP32/wykresy" target="_blank">Wykresy</a>
    </p>

    <hr>

    <!-- Sterowanie RGB -->
    <h3>Oświetlenie RGB</h3>
    <input type="color" id="colorPicker" value="#ff0000">

    <br><br>
    <button onclick="logout()">Wyloguj</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <script>
    // --- KONFIGURACJA FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyDhjqjLQHWSucCbi_UL42WN_lJFVtzT6H0",
      authDomain: "TWOJ_PROJEKT.firebaseapp.com",
      databaseURL: "https://esp32-inz-default-rtdb.firebaseio.com/",
      projectId: "ESP32 INZ"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const auth = firebase.auth();

    // --- SPRAWDZENIE STANU LOGOWANIA ---
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        initApp();
      } else {
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("dashboard").style.display = "none";
      }
    });

    // --- LOGOWANIE ---
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorElem = document.getElementById("loginError");
      errorElem.innerText = "";

      auth.signInWithEmailAndPassword(email, password)
        .catch(error => {
          errorElem.innerText = "Błąd logowania: " + error.message;
        });
    }

    function logout() {
      auth.signOut();
    }

    // --- DASHBOARD ---
    function initApp() {

      // --- tempMin / tempMax (1 miejsce po przecinku) ---
      db.ref("/settings/tempMin").on("value", snap => {
        const v = snap.val();
        if (v !== null)
          document.getElementById("tempMin").value = Number(v).toFixed(1);
      });

      db.ref("/settings/tempMax").on("value", snap => {
        const v = snap.val();
        if (v !== null)
          document.getElementById("tempMax").value = Number(v).toFixed(1);
      });

      // --- DS18B20 ---
      db.ref("/temperature").on("value", snap => {
        const v = snap.val();
        if (v !== null)
          document.getElementById("temp").innerText = Number(v).toFixed(1);
      });

      // --- BMP280 ---
      db.ref("/bmp280/temperature").on("value", snap => {
        const v = snap.val();
        if (v !== null)
          document.getElementById("bmpTemp").innerText = Number(v).toFixed(1);
      });

      db.ref("/bmp280/pressure").on("value", snap => {
        const v = snap.val();
        if (v !== null)
          document.getElementById("bmpPressure").innerText = Number(v).toFixed(1);
      });

      // --- Grzałka ---
      db.ref("/heaterState").on("value", snap => {
        document.getElementById("heaterState").innerText =
          snap.val() ? "Włączona" : "Wyłączona";
      });

      // --- RGB ---
      const picker = document.getElementById("colorPicker");
      picker.addEventListener("input", e => {
        const hex = e.target.value;
        db.ref("/led/r").set(parseInt(hex.substr(1, 2), 16));
        db.ref("/led/g").set(parseInt(hex.substr(3, 2), 16));
        db.ref("/led/b").set(parseInt(hex.substr(5, 2), 16));
      });
    }

    // --- ZAPIS USTAWIEŃ ---
    function saveSettings() {
      const min = parseFloat(document.getElementById("tempMin").value);
      const max = parseFloat(document.getElementById("tempMax").value);

      if (min >= max) {
        alert("Temperatura MIN musi być mniejsza niż MAX.");
        return;
      }

      db.ref("/settings/tempMin").set(min);
      db.ref("/settings/tempMax").set(max);

      alert("Zapisano ustawienia.");
    }
  </script>
</body>
</html>
