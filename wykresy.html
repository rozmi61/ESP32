<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Internetowy układ regulacji akwarium - Wykresy</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Plugin do poziomych linii -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    canvas {
      margin-top: 25px;
      margin-bottom: 40px;
    }
    h2 {
      margin-bottom: 10px;
    }
    .chart-block {
      max-width: 700px;
      margin-bottom: 40px;
    }
  </style>
</head>

<body>
  <h2>Internetowy układ regulacji akwarium - Wykresy</h2>

  <!-- 1. Temperatura DS18B20 -->
  <div class="chart-block">
    <h3>1) Temperatura wody (DS18B20 z punktami tempMin i tempMax) </h3>
    <canvas id="chartTempDS"></canvas>
  </div>

  <!-- 2. Stan grzałki -->
  <div class="chart-block">
    <h3>2) Przebieg sterowania (Stan grzałki 0 = OFF, 1 = ON)</h3>
    <canvas id="chartHeater"></canvas>
  </div>

  <!-- 3. Temp BMP280 -->
  <div class="chart-block">
    <h3>3) Temperatura w pomieszczeniu (BMP280)</h3>
    <canvas id="chartBMPtemp"></canvas>
  </div>

  <!-- 4. Ciśnienie BMP280 -->
  <div class="chart-block">
    <h3>4) Ciśnienie w pomieszczeniu (BMP280)</h3>
    <canvas id="chartBMPpress"></canvas>
  </div>

<script>
  // --- KONFIGURACJA FIREBASE ---
  const firebaseConfig = {
    apiKey: "AIzaSyDhjqjLQHWSucCbi_UL42WN_lJFVtzT6H0",
    authDomain: "TWOJ_PROJEKT.firebaseapp.com",
    databaseURL: "https://esp32-inz-default-rtdb.firebaseio.com/",
    projectId: "ESP32 INZ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // -----------------------------
  // LOGOWANIE DO FIREBASE
  // -----------------------------
  auth.signInWithEmailAndPassword("esp32@myiot.com", "esp32123")
    .then(() => {
      initCharts();
    })
    .catch(e => alert("Błąd logowania do Firebase"));

  // ===========================================================
  //                   TWORZENIE WYKRESÓW
  // ===========================================================
  function initCharts() {

    // Helper – ograniczenie do 60 punktów
    function limit(chart) {
      if (chart.data.labels.length > 200) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }
    }

    // -----------------------------------------------------------
    // 1) WYKRES DS18B20 + poziome linie tempMin / tempMax (plugin annotation)
    // -----------------------------------------------------------
    const ctx1 = document.getElementById("chartTempDS").getContext("2d");
    const chartTempDS = new Chart(ctx1, {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            label: "Temperatura (°C)",
            data: [],
            borderWidth: 2,
            borderColor: 'black',
            backgroundColor: 'rgba(0,0,0,0.0)'
          }
        ]
      },
      options: {
        animation: false,
        plugins: {
          annotation: {
            annotations: {
              tempMinLine: {
                type: 'line',
                yMin: 0,
                yMax: 0,
                borderColor: 'blue',
                borderWidth: 1,
                borderDash: [5,5],
                label: { content: 'MIN', enabled: true, position: 'start' }
              },
              tempMaxLine: {
                type: 'line',
                yMin: 0,
                yMax: 0,
                borderColor: 'red',
                borderWidth: 1,
                borderDash: [5,5],
                label: { content: 'MAX', enabled: true, position: 'start' }
              }
            }
          }
        },
        scales: {
          y: {
            // opcjonalnie ustaw min/max, np:
            // min: 0,
            // max: 40
          }
        }
      }
    });

    // Aktualna temperatura
    db.ref("/temperature").on("value", snap => {
      const v = snap.val();
      const t = new Date().toLocaleTimeString();

      chartTempDS.data.labels.push(t);
      chartTempDS.data.datasets[0].data.push(v);

      limit(chartTempDS);
      chartTempDS.update();
    });

    // tempMin
    db.ref("/settings/tempMin").on("value", snap => {
      const minv = snap.val();
      chartTempDS.options.plugins.annotation.annotations.tempMinLine.yMin = minv;
      chartTempDS.options.plugins.annotation.annotations.tempMinLine.yMax = minv;
      chartTempDS.update();
    });

    // tempMax
    db.ref("/settings/tempMax").on("value", snap => {
      const maxv = snap.val();
      chartTempDS.options.plugins.annotation.annotations.tempMaxLine.yMin = maxv;
      chartTempDS.options.plugins.annotation.annotations.tempMaxLine.yMax = maxv;
      chartTempDS.update();
    });

    // -----------------------------------------------------------
    // 2) WYKRES STANU GRZAŁKI
    // -----------------------------------------------------------
    const ctx2 = document.getElementById("chartHeater").getContext("2d");
    const chartHeater = new Chart(ctx2, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Grzałka (0/1)",
          data: [],
          stepped: true,
          borderWidth: 2
        }]
      },
      options: {
        animation: false,
        scales: { y: { min: 0, max: 1, ticks: { stepSize: 1 } } }
      }
    });

    db.ref("/heaterState").on("value", snap => {
      const v = snap.val() ? 1 : 0;
      const t = new Date().toLocaleTimeString();

      chartHeater.data.labels.push(t);
      chartHeater.data.datasets[0].data.push(v);

      limit(chartHeater);
      chartHeater.update();
    });

    // -----------------------------------------------------------
    // 3) WYKRES TEMPERATURY BMP280
    // -----------------------------------------------------------
    const ctx3 = document.getElementById("chartBMPtemp").getContext("2d");
    const chartBMPtemp = new Chart(ctx3, {
      type: "line",
      data: { labels: [], datasets: [{ label: "BMP280 Temp (°C)", data: [], borderWidth: 2 }] },
      options: { animation: false }
    });

    db.ref("/bmp280/temperature").on("value", snap => {
      const v = snap.val();
      const t = new Date().toLocaleTimeString();

      chartBMPtemp.data.labels.push(t);
      chartBMPtemp.data.datasets[0].data.push(v);

      limit(chartBMPtemp);
      chartBMPtemp.update();
    });

    // -----------------------------------------------------------
    // 4) WYKRES CIŚNIENIA BMP280
    // -----------------------------------------------------------
    const ctx4 = document.getElementById("chartBMPpress").getContext("2d");
    const chartBMPpress = new Chart(ctx4, {
      type: "line",
      data: { labels: [], datasets: [{ label: "BMP280 Ciśnienie (hPa)", data: [], borderWidth: 2 }] },
      options: { animation: false }
    });

    db.ref("/bmp280/pressure").on("value", snap => {
      const v = snap.val();
      const t = new Date().toLocaleTimeString();

      chartBMPpress.data.labels.push(t);
      chartBMPpress.data.datasets[0].data.push(v);

      limit(chartBMPpress);
      chartBMPpress.update();
    });
  }
</script>

</body>
</html>
