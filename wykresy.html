<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Internetowy układ regulacji akwarium - Wykresy</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Plugin do poziomych linii -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    canvas { margin-top: 25px; margin-bottom: 40px; }
    .chart-block { max-width: 700px; margin-bottom: 40px; }
  </style>
</head>

<body>
<h2>Internetowy układ regulacji akwarium - Wykresy</h2>

<div class="chart-block">
  <h3>1) Temperatura wody (DS18B20)</h3>
  <canvas id="chartTempDS"></canvas>
</div>

<div class="chart-block">
  <h3>2) Stan grzałki</h3>
  <canvas id="chartHeater"></canvas>
</div>

<div class="chart-block">
  <h3>3) Temperatura BMP280</h3>
  <canvas id="chartBMPtemp"></canvas>
</div>

<div class="chart-block">
  <h3>4) Ciśnienie BMP280</h3>
  <canvas id="chartBMPpress"></canvas>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDhjqjLQHWSucCbi_UL42WN_lJFVtzT6H0",
    authDomain: "TWOJ_PROJEKT.firebaseapp.com",
    databaseURL: "https://esp32-inz-default-rtdb.firebaseio.com/",
    projectId: "ESP32 INZ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  auth.signInWithEmailAndPassword("esp32@myiot.com", "esp32123")
    .then(initCharts)
    .catch(() => alert("Błąd logowania do Firebase"));

  function initCharts() {

    function limit(chart) {
      if (chart.data.labels.length > 200) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }
    }

    // ===== DS18B20 =====
    const chartTempDS = new Chart(
      document.getElementById("chartTempDS"),
      {
        type: "line",
        data: { labels: [], datasets: [{ label: "Temp (°C)", data: [], borderWidth: 2 }] },
        options: {
          animation: false,
          plugins: {
            annotation: {
              annotations: {
                min: { type: 'line', yMin: 0, yMax: 0, borderColor: 'blue', borderDash: [5,5] },
                max: { type: 'line', yMin: 0, yMax: 0, borderColor: 'red', borderDash: [5,5] }
              }
            }
          }
        }
      }
    );

    db.ref("/temperature").on("value", snap => {
      const v = snap.val();
      if (v === null) return;

      chartTempDS.data.labels.push(new Date().toLocaleTimeString());
      chartTempDS.data.datasets[0].data.push(
        Number(Number(v).toFixed(1))
      );
      limit(chartTempDS);
      chartTempDS.update();
    });

    db.ref("/settings/tempMin").on("value", snap => {
      const v = snap.val();
      if (v !== null) {
        chartTempDS.options.plugins.annotation.annotations.min.yMin = Number(v);
        chartTempDS.options.plugins.annotation.annotations.min.yMax = Number(v);
        chartTempDS.update();
      }
    });

    db.ref("/settings/tempMax").on("value", snap => {
      const v = snap.val();
      if (v !== null) {
        chartTempDS.options.plugins.annotation.annotations.max.yMin = Number(v);
        chartTempDS.options.plugins.annotation.annotations.max.yMax = Number(v);
        chartTempDS.update();
      }
    });

    // ===== GRZAŁKA =====
    const chartHeater = new Chart(
      document.getElementById("chartHeater"),
      {
        type: "line",
        data: { labels: [], datasets: [{ label: "Grzałka", data: [], stepped: true }] },
        options: { animation: false, scales: { y: { min: 0, max: 1, ticks: { stepSize: 1 }}}}
      }
    );

    db.ref("/heaterState").on("value", snap => {
      chartHeater.data.labels.push(new Date().toLocaleTimeString());
      chartHeater.data.datasets[0].data.push(snap.val() ? 1 : 0);
      limit(chartHeater);
      chartHeater.update();
    });

    // ===== BMP280 TEMP =====
    const chartBMPtemp = new Chart(
      document.getElementById("chartBMPtemp"),
      {
        type: "line",
        data: { labels: [], datasets: [{ label: "BMP280 Temp (°C)", data: [] }] },
        options: { animation: false }
      }
    );

    db.ref("/bmp280/temperature").on("value", snap => {
      const v = snap.val();
      if (v === null) return;

      chartBMPtemp.data.labels.push(new Date().toLocaleTimeString());
      chartBMPtemp.data.datasets[0].data.push(
        Number(Number(v).toFixed(1))
      );
      limit(chartBMPtemp);
      chartBMPtemp.update();
    });

    // ===== BMP280 PRESS =====
    const chartBMPpress = new Chart(
      document.getElementById("chartBMPpress"),
      {
        type: "line",
        data: { labels: [], datasets: [{ label: "BMP280 Ciśnienie (hPa)", data: [] }] },
        options: { animation: false }
      }
    );

    db.ref("/bmp280/pressure").on("value", snap => {
      const v = snap.val();
      if (v === null) return;

      chartBMPpress.data.labels.push(new Date().toLocaleTimeString());
      chartBMPpress.data.datasets[0].data.push(
        Number(Number(v).toFixed(1))
      );
      limit(chartBMPpress);
      chartBMPpress.update();
    });
  }
</script>
</body>
</html>
